<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fondo circular nocturno -->
  <circle cx="32" cy="32" r="30" fill="#0d0b0f" stroke="#d4af37" stroke-width="1.5"/>

  <!-- FLOR EN PLENO ESPLENDOR (Capa de Fondo) -->
  <g transform="translate(32, 32)">
    <!-- Pétalos exteriores radiales -->
    <g fill="#f5be18" opacity="0.85">
      <path d="M 0,-26 C 4,-18 4,-8 0,0 C -4,-8 -4,-18 0,-26 Z"/>
      <path d="M 0,-26 C 4,-18 4,-8 0,0 C -4,-8 -4,-18 0,-26 Z" transform="rotate(30)"/>
      <path d="M 0,-26 C 4,-18 4,-8 0,0 C -4,-8 -4,-18 0,-26 Z" transform="rotate(60)"/>
      <path d="M 0,-26 C 4,-18 4,-8 0,0 C -4,-8 -4,-18 0,-26 Z" transform="rotate(90)"/>
      <path d="M 0,-26 C 4,-18 4,-8 0,0 C -4,-8 -4,-18 0,-26 Z" transform="rotate(120)"/>
      <path d="M 0,-26 C 4,-18 4,-8 0,0 C -4,-8 -4,-18 0,-26 Z" transform="rotate(150)"/>
      <path d="M 0,-26 C 4,-18 4,-8 0,0 C -4,-8 -4,-18 0,-26 Z" transform="rotate(180)"/>
      <path d="M 0,-26 C 4,-18 4,-8 0,0 C -4,-8 -4,-18 0,-26 Z" transform="rotate(210)"/>
      <path d="M 0,-26 C 4,-18 4,-8 0,0 C -4,-8 -4,-18 0,-26 Z" transform="rotate(240)"/>
      <path d="M 0,-26 C 4,-18 4,-8 0,0 C -4,-8 -4,-18 0,-26 Z" transform="rotate(270)"/>
      <path d="M 0,-26 C 4,-18 4,-8 0,0 C -4,-8 -4,-18 0,-26 Z" transform="rotate(300)"/>
      <path d="M 0,-26 C 4,-18 4,-8 0,0 C -4,-8 -4,-18 0,-26 Z" transform="rotate(330)"/>
    </g>
    <!-- Capa interna de pétalos más claros -->
    <g fill="#ffd166" opacity="0.9">
      <path d="M 0,-20 C 3,-14 3,-6 0,0 C -3,-6 -3,-14 0,-20 Z" transform="rotate(15)"/>
      <path d="M 0,-20 C 3,-14 3,-6 0,0 C -3,-6 -3,-14 0,-20 Z" transform="rotate(45)"/>
      <path d="M 0,-20 C 3,-14 3,-6 0,0 C -3,-6 -3,-14 0,-20 Z" transform="rotate(75)"/>
      <path d="M 0,-20 C 3,-14 3,-6 0,0 C -3,-6 -3,-14 0,-20 Z" transform="rotate(105)"/>
      <path d="M 0,-20 C 3,-14 3,-6 0,0 C -3,-6 -3,-14 0,-20 Z" transform="rotate(135)"/>
      <path d="M 0,-20 C 3,-14 3,-6 0,0 C -3,-6 -3,-14 0,-20 Z" transform="rotate(165)"/>
      <path d="M 0,-20 C 3,-14 3,-6 0,0 C -3,-6 -3,-14 0,-20 Z" transform="rotate(195)"/>
      <path d="M 0,-20 C 3,-14 3,-6 0,0 C -3,-6 -3,-14 0,-20 Z" transform="rotate(225)"/>
      <path d="M 0,-20 C 3,-14 3,-6 0,0 C -3,-6 -3,-14 0,-20 Z" transform="rotate(255)"/>
      <path d="M 0,-20 C 3,-14 3,-6 0,0 C -3,-6 -3,-14 0,-20 Z" transform="rotate(285)"/>
      <path d="M 0,-20 C 3,-14 3,-6 0,0 C -3,-6 -3,-14 0,-20 Z" transform="rotate(315)"/>
      <path d="M 0,-20 C 3,-14 3,-6 0,0 C -3,-6 -3,-14 0,-20 Z" transform="rotate(345)"/>
    </g>
    <!-- Centro de Polen -->
    <circle cx="0" cy="0" r="11" fill="#0d0b0f"/>
    <circle cx="0" cy="0" r="9" fill="#8c580c"/>
    <circle cx="0" cy="0" r="6" fill="#d4af37"/>
  </g>

  <!-- LETRA M (Base - Abajo) -->
  <text x="32" y="47" 
        fill="#f5be18" 
        stroke="#0d0b0f" 
        stroke-width="2.5" 
        paint-order="stroke fill"
        font-family="'Cormorant Garamond', 'Georgia', serif" 
        font-size="30" 
        font-weight="bold" 
        text-anchor="middle">
    M
  </text>

  <!-- LETRA S (Superpuesta - Arriba) -->
  <text x="32" y="32" 
        fill="#fdfbf7" 
        stroke="#0d0b0f" 
        stroke-width="2.5" 
        paint-order="stroke fill"
        font-family="'Cormorant Garamond', 'Georgia', serif" 
        font-size="26" 
        font-weight="bold" 
        text-anchor="middle">
    S
  </text>
</svg>
